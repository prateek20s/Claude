name: Build Debug APK
on:
  push:
    branches: [ beacon-poc-build ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Grant gradlew execute permission
        run: chmod +x ./gradlew

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish APK to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete beacon-poc -y --cleanup-tag 2>/dev/null || true
          gh release create beacon-poc app/build/outputs/apk/debug/*.apk \
            --target beacon-poc-build \
            --title "BFL Beacon POC — Debug APK" \
            --notes "Debug APK (demo mode). Sideload on an Android phone to test. Enable 'Install unknown apps' for your browser/file manager first."

      - name: Commit build error log on failure
        if: failure()
        run: |
          mkdir -p ci-logs
          tail -c 80000 build.log > ci-logs/build-error.log || echo "no build.log" > ci-logs/build-error.log
          git config user.email "ci@local"
          git config user.name "ci-bot"
          git add ci-logs/build-error.log
          git commit -m "CI: build error log [skip ci]" || true
          git push origin HEAD:beacon-poc-build || true
